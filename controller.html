<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Game Controller</title>
  <!-- Thư viện đọc File Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <style>
    /* CSS Animation cho Chủ đề */
    @keyframes wipeDownCenter {
      0% {
        transform: translateY(-100%);
        opacity: 0;
        clip-path: inset(0 0 100% 0);
      }
      100% {
        transform: translateY(0);
        opacity: 1;
        clip-path: inset(0 0 0 0);
      }
    }

    @keyframes zoomOut {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      100% {
        transform: scale(0);
        opacity: 0;
      }
    }

    .topic-card.selected {
      animation: wipeDownCenter 0.8s ease-in-out forwards;
      margin: 0 auto;
    }

    .topic-card.unselected {
      animation: zoomOut 0.6s ease-in-out forwards;
    }

    /* Ẩn bảng 100 người chơi */
    #player-board-100 {
      display: none !important;
    }

    /* Khung câu hỏi & nút bấm */
    .question-box {
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .question-box.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.95);
    }

    .btn-help:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- KHU VỰC NHẬP ĐỀ EXCEL -->
  <div class="control-panel">
    <button onclick="document.getElementById('excel-file').click()">📂 Nhập đề từ Excel</button>
    <input type="file" id="excel-file" accept=".xlsx, .xls" style="display: none;">
    <span id="file-status">Chưa chọn file</span>
  </div>

  <hr>

  <!-- KHU VỰC QUYỀN TRỢ GIÚP (Chỉ hoạt động từ câu 2) -->
  <div class="lifelines">
    <h3>Quyền trợ giúp:</h3>
    <button class="btn-help" id="help-5050" disabled onclick="useHelp('5050')">50:50</button>
    <button class="btn-help" id="help-audience" disabled onclick="useHelp('audience')">Hỏi ý kiến</button>
  </div>

  <hr>

  <!-- KHU VỰC CHỌN CHỦ ĐỀ -->
  <div id="topics-container" style="display: flex; gap: 20px; justify-content: center;">
    <div class="topic-card" id="topic-1" onclick="selectTopic(1)">Chủ đề 1</div>
    <div class="topic-card" id="topic-2" onclick="selectTopic(2)">Chủ đề 2</div>
    <div class="topic-card" id="topic-3" onclick="selectTopic(3)">Chủ đề 3</div>
  </div>

  <hr>

  <!-- KHU VỰC CÂU HỎI & 3 ĐÁP ÁN -->
  <div id="question-container" class="question-box hidden">
    <h2 id="question-title">Nội dung câu hỏi...</h2>
    
    <div class="answers-group" style="display: flex; flex-direction: column; gap: 10px;">
      <button class="btn-answer" id="btn-ans-a" onclick="submitAnswer('A')">A. Đáp án 1</button>
      <button class="btn-answer" id="btn-ans-b" onclick="submitAnswer('B')">B. Đáp án 2</button>
      <button class="btn-answer" id="btn-ans-c" onclick="submitAnswer('C')">C. Đáp án 3</button>
    </div>
  </div>

  <script>
    let questionsData = [];
    let currentQuestionIndex = 0;

    // 1. Xử lý Nhập File Excel
    document.getElementById('excel-file').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        
        // Chuyển dữ liệu Excel thành mảng Object
        questionsData = XLSX.utils.sheet_to_json(firstSheet);
        
        document.getElementById('file-status').innerText = `Đã tải ${questionsData.length} câu hỏi!`;
        currentQuestionIndex = 0;
        loadQuestion(currentQuestionIndex);
      };
      reader.readAsArrayBuffer(file);
    });

    // 2. Load Câu hỏi & Cập nhật Trạng thái Trợ giúp
    function loadQuestion(index) {
      if (index >= questionsData.length) {
        alert("Đã hoàn thành toàn bộ câu hỏi!");
        return;
      }

      const q = questionsData[index];
      document.getElementById('question-title').innerText = `Câu ${index + 1}: ${q.CauHoi}`;
      document.getElementById('btn-ans-a').innerText = `A. ${q.DapAnA}`;
      document.getElementById('btn-ans-b').innerText = `B. ${q.DapAnB}`;
      document.getElementById('btn-ans-c').innerText = `C. ${q.DapAnC}`;

      // Hiển thị khung câu hỏi
      document.getElementById('question-container').classList.remove('hidden');

      // Cập nhật Quyền trợ giúp: Khóa ở câu 1 (index 0), Mở từ câu 2 (index >= 1)
      const helpButtons = document.querySelectorAll('.btn-help');
      helpButtons.forEach(btn => {
        btn.disabled = (index === 0);
      });
    }

    // 3. Xử lý sau khi hoàn thành mỗi câu hỏi (Ẩn đi)
    function submitAnswer(selectedOption) {
      const qContainer = document.getElementById('question-container');
      
      // Ẩn màn hình câu hỏi hiện tại
      qContainer.classList.add('hidden');

      // Chờ animation ẩn xong thì tăng index và chuẩn bị cho câu tiếp theo
      setTimeout(() => {
        currentQuestionIndex++;
        if (currentQuestionIndex < questionsData.length) {
          loadQuestion(currentQuestionIndex);
        }
      }, 600);
    }

    // 4. Animation Chọn chủ đề
    function selectTopic(selectedId) {
      const topics = document.querySelectorAll('.topic-card');
      topics.forEach((topic, idx) => {
        if (idx + 1 === selectedId) {
          topic.classList.remove('unselected');
          topic.classList.add('selected');
        } else {
          topic.classList.remove('selected');
          topic.classList.add('unselected');
        }
      });
    }

    function useHelp(type) {
      alert(`Đã sử dụng quyền trợ giúp: ${type}`);
    }
  </script>
</body>
</html>
