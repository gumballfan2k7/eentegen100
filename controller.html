<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đấu Trường 100 - Controller</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #12122b; color: #fff; padding: 20px; max-width: 850px; margin: 0 auto; }
    h1 { text-align: center; color: #a855f7; margin-bottom: 20px; }
    .panel { background: #1e1e3e; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #3b3b6d; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; color: #c084fc; }
    input[type="text"], textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #4c4c85; background: #0c0c1e; color: #fff; font-size: 1rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    button { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.95rem; transition: 0.2s; }
    .btn-purple { background: #8b5cf6; color: white; }
    .btn-blue { background: #0ea5e9; color: white; }
    .btn-amber { background: #f59e0b; color: white; }
    .btn-green { background: #10b981; color: white; }
    .btn-red { background: #ef4444; color: white; }
    button:hover { opacity: 0.85; transform: translateY(-1px); }
    .radio-group { display: flex; gap: 20px; margin-top: 5px; background: #0c0c1e; padding: 10px; border-radius: 6px; }
    .radio-group label { color: white; margin: 0; cursor: pointer; }
  </style>
</head>
<body>

  <h1>BẢNG ĐIỀU KHIỂN ĐẤU TRƯỜNG 100</h1>

  <div class="panel">
    <h3>1. Nhập Nội Dung Câu Hỏi & Đáp Án</h3>
    <br>
    <div class="form-group">
      <label>Nội dung câu hỏi:</label>
      <textarea id="qInput" rows="2">CÂU HỎI?</textarea>
    </div>

    <div class="grid-3">
      <div class="form-group">
        <label>Đáp án A:</label>
        <input type="text" id="optA" value="ĐÁP ÁN A">
      </div>
      <div class="form-group">
        <label>Đáp án B:</label>
        <input type="text" id="optB" value="ĐÁP ÁN B">
      </div>
      <div class="form-group">
        <label>Đáp án C:</label>
        <input type="text" id="optC" value="ĐÁP ÁN C">
      </div>
    </div>

    <div class="form-group">
      <label>Đáp án Đúng là:</label>
      <div class="radio-group">
        <label><input type="radio" name="correctOpt" value="A" checked> A</label>
        <label><input type="radio" name="correctOpt" value="B"> B</label>
        <label><input type="radio" name="correctOpt" value="C"> C</label>
      </div>
    </div>

    <div class="form-group">
      <label>Text trợ giúp (Góc trên phải):</label>
      <input type="text" id="lifelinesInput" value="25%  50%  75%">
    </div>

    <button class="btn-purple" onclick="sendData()">💾 Cập Nhật Sang Màn Hình Display</button>
  </div>

  <div class="panel">
    <h3>2. Điều Khiển Hiệu Ứng Trình Chiếu</h3>
    <br>
    <label>Ẩn / Hiện yếu tố:</label>
    <div class="btn-group">
      <button class="btn-blue" onclick="toggleQuestion()">👁️ Ẩn/Hiện Câu Hỏi</button>
      <button class="btn-blue" onclick="toggleAnswers()">🔘 Ẩn/Hiện 3 Đáp Án</button>
    </div>
    
    <br>
    <label>Chọn đáp án người chơi chốt (Đổi màu cam):</label>
    <div class="btn-group">
      <button class="btn-amber" onclick="selectOption('A')">Chọn A</button>
      <button class="btn-amber" onclick="selectOption('B')">Chọn B</button>
      <button class="btn-amber" onclick="selectOption('C')">Chọn C</button>
      <button class="btn-red" onclick="selectOption('')">Bỏ chọn</button>
    </div>

    <br>
    <label>Công bố kết quả:</label>
    <div class="btn-group">
      <button class="btn-green" onclick="revealCorrect()">✅ Công Bố Đáp Án Đúng (Xanh/Đỏ)</button>
      <button class="btn-red" onclick="resetAll()">🔄 Reset Trạng Thái</button>
    </div>
  </div>

  <script>
    const channel = new BroadcastChannel('dt100_channel');

    let state = {
      question: 'CÂU HỎI?',
      optionA: 'ĐÁP ÁN A',
      optionB: 'ĐÁP ÁN B',
      optionC: 'ĐÁP ÁN C',
      correctOption: 'A',
      lifelines: '25%  50%  75%',
      showQuestion: true,
      showAnswers: true,
      selectedOption: '',
      revealed: false
    };

    function sync() {
      localStorage.setItem('dt100_state', JSON.stringify(state));
      channel.postMessage(state);
    }

    function sendData() {
      state.question = document.getElementById('qInput').value;
      state.optionA = document.getElementById('optA').value;
      state.optionB = document.getElementById('optB').value;
      state.optionC = document.getElementById('optC').value;
      state.lifelines = document.getElementById('lifelinesInput').value;
      
      const radios = document.getElementsByName('correctOpt');
      for (const r of radios) {
        if (r.checked) state.correctOption = r.value;
      }

      state.selectedOption = '';
      state.revealed = false;
      sync();
    }

    function toggleQuestion() {
      state.showQuestion = !state.showQuestion;
      sync();
    }

    function toggleAnswers() {
      state.showAnswers = !state.showAnswers;
      sync();
    }

    function selectOption(opt) {
      state.selectedOption = opt;
      state.revealed = false;
      sync();
    }

    function revealCorrect() {
      state.revealed = true;
      sync();
    }

    function resetAll() {
      state.selectedOption = '';
      state.revealed = false;
      state.showQuestion = true;
      state.showAnswers = true;
      sync();
    }

    sync();
  </script>
</body>
</html>
