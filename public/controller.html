<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Een Tegen 100 - Controller</title>
    <link rel="stylesheet" href="controller.css">
    <!-- SheetJS for Excel parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
</head>
<body class="controller-page">
    <div class="controller-container">
        <!-- Header -->
        <header class="controller-header">
            <div class="header-left">
                <h1 class="title-main">EEN TEGEN 100</h1>
                <p class="subtitle">Game Controller</p>
            </div>
            <div class="header-right">
                <div class="connection-status">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">Ready</span>
                </div>
                <button class="btn-icon" id="muteBtn" title="Toggle Audio (M)">🔊</button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="controller-content">
            <!-- Upload Section -->
            <section class="section upload-section">
                <h2 class="section-title">📋 Upload Questions</h2>
                <div class="upload-container">
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">📁</div>
                        <p>Drag & drop Excel file here</p>
                        <p class="upload-hint">or click to select</p>
                        <input type="file" id="fileInput" accept=".xlsx,.xls" hidden>
                    </div>
                    <button id="uploadBtn" class="btn btn-primary btn-lg" disabled>Upload Questions</button>
                    <div id="uploadStatus" class="status-message"></div>
                </div>
            </section>

            <!-- Game Control Section -->
            <section class="section game-control-section">
                <h2 class="section-title">🎮 Game Control</h2>
                <div class="button-grid">
                    <button id="startGameBtn" class="btn btn-lg btn-success">Start Game</button>
                    <button id="nextQuestionBtn" class="btn btn-lg btn-primary" disabled>Next Question</button>
                    <button id="endGameBtn" class="btn btn-lg btn-danger" disabled>End Game</button>
                </div>
            </section>

            <!-- Question Display Section -->
            <section class="section question-section">
                <h2 class="section-title">❓ Current Question</h2>
                <div class="question-display" id="questionDisplay">
                    <p class="no-question">No question loaded</p>
                </div>
            </section>

            <!-- Answer Section -->
            <section class="section answer-section">
                <h2 class="section-title">✅ Select & Submit Answer</h2>
                <div class="answer-grid" id="answerGrid">
                    <button class="answer-btn" data-answer="A">A</button>
                    <button class="answer-btn" data-answer="B">B</button>
                    <button class="answer-btn" data-answer="C">C</button>
                    <button class="answer-btn" data-answer="D">D</button>
                </div>
                <div class="submit-area">
                    <input type="number" id="eliminatedInput" placeholder="# eliminated" min="0" max="100">
                    <button id="submitAnswerBtn" class="btn btn-lg btn-success" disabled>✓ Confirm Answer</button>
                </div>
                <div id="answerFeedback" class="status-message"></div>
            </section>

            <!-- Lifelines Section -->
            <section class="section lifelines-section">
                <h2 class="section-title">🎯 Lifelines</h2>
                <div class="lifelines-grid">
                    <button id="pollBtn" class="lifeline-btn" title="See mob vote percentages">
                        <span class="lifeline-icon">📊</span>
                        <span>Poll the Mob</span>
                    </button>
                    <button id="askBtn" class="lifeline-btn" title="Get advice from 2 mob members">
                        <span class="lifeline-icon">💬</span>
                        <span>Ask the Mob</span>
                    </button>
                    <button id="trustBtn" class="lifeline-btn" title="Auto-accept mob majority">
                        <span class="lifeline-icon">🤝</span>
                        <span>Trust the Mob</span>
                    </button>
                </div>
                <div id="lifelineOutput" class="lifeline-output"></div>
            </section>

            <!-- Statistics Section -->
            <section class="section stats-section">
                <h2 class="section-title">📊 Game Statistics</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Mob Alive</div>
                        <div class="stat-value" id="mobAlive">100</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Eliminated</div>
                        <div class="stat-value" id="eliminated">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Current Prize</div>
                        <div class="stat-value" id="currentPrize">€0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Total Prize Pool</div>
                        <div class="stat-value" id="totalPrize">€0</div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../game-engine.js"></script>
    <script src="controller.js"></script>
</body>
</html>
