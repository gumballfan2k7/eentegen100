<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Een Tegen 100 - Spectator View</title>
    <link rel="stylesheet" href="spectator.css">
</head>
<body>
    <div class="spectator-container">
        <!-- Background -->
        <div class="background-overlay"></div>

        <!-- Header -->
        <header class="game-header">
            <div class="header-left">
                <h1>🎬 Een Tegen 100</h1>
                <p class="subtitle">Spectator View</p>
            </div>
            <div class="header-center">
                <div class="game-info">
                    <div class="info-item">
                        <span class="label">Ronde</span>
                        <span id="roundNumber" class="value">0/100</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Prijs</span>
                        <span id="currentPrize" class="value">€500</span>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <div class="connection-status">
                    <span id="connectionStatus" class="status-indicator connecting">Connecting...</span>
                </div>
            </div>
        </header>

        <!-- Main Game Content -->
        <div class="game-content">
            <!-- Left: Contestant & Eliminated Count -->
            <div class="left-panel">
                <div class="contestant-display">
                    <div class="contestant-card">
                        <div class="contestant-avatar">🧑‍🎓</div>
                        <div class="contestant-details">
                            <h2>The One</h2>
                            <p class="status" id="contestantStatus">Waiting...</p>
                        </div>
                    </div>
                </div>

                <div class="stats-display">
                    <div class="stat-box">
                        <span class="stat-icon">❌</span>
                        <div class="stat-info">
                            <span class="stat-label">Eliminated</span>
                            <span id="eliminatedCount" class="stat-number">0</span>
                        </div>
                    </div>
                    <div class="stat-box">
                        <span class="stat-icon">✅</span>
                        <div class="stat-info">
                            <span class="stat-label">Remaining</span>
                            <span id="remainingCount" class="stat-number">100</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Center: Question & Answers -->
            <div class="center-panel">
                <div class="question-display" id="questionDisplay">
                    <p class="placeholder">Waiting for question...</p>
                </div>

                <div class="answers-grid" id="answersGrid">
                    <div class="answer-option" data-option="A">
                        <span class="option-letter">A</span>
                        <span class="option-text" id="optionA">-</span>
                    </div>
                    <div class="answer-option" data-option="B">
                        <span class="option-letter">B</span>
                        <span class="option-text" id="optionB">-</span>
                    </div>
                    <div class="answer-option" data-option="C">
                        <span class="option-letter">C</span>
                        <span class="option-text" id="optionC">-</span>
                    </div>
                    <div class="answer-option" data-option="D">
                        <span class="option-letter">D</span>
                        <span class="option-text" id="optionD">-</span>
                    </div>
                </div>
            </div>

            <!-- Right: Mob Display -->
            <div class="right-panel">
                <div class="mob-header">
                    <h3>📊 De 100</h3>
                    <p class="mob-subtitle">The Mob</p>
                </div>
                <div class="mob-grid" id="mobGrid">
                    <!-- Mob members will be generated here -->
                </div>
            </div>
        </div>

        <!-- Bottom: Lifelines & Prize Display -->
        <footer class="game-footer">
            <div class="lifelines-display">
                <div class="lifeline-indicator" id="lifeline-poll">
                    <span class="lifeline-icon">🎤</span>
                    <span class="lifeline-name">Poll</span>
                </div>
                <div class="lifeline-indicator" id="lifeline-ask">
                    <span class="lifeline-icon">💬</span>
                    <span class="lifeline-name">Ask</span>
                </div>
                <div class="lifeline-indicator" id="lifeline-trust">
                    <span class="lifeline-icon">🤝</span>
                    <span class="lifeline-name">Trust</span>
                </div>
            </div>

            <div class="prize-ladder">
                <div class="prize-step active">€500</div>
                <div class="prize-step">€1K</div>
                <div class="prize-step">€2K</div>
                <div class="prize-step">€5K</div>
                <div class="prize-step">€10K</div>
            </div>
        </footer>
    </div>

    <!-- Audio Control -->
    <audio id="correctAudio" preload="auto">
        <source src="../audio/correct_answer.mp3" type="audio/mpeg">
    </audio>
    <audio id="wrongAudio" preload="auto">
        <source src="../audio/wrong_answer.mp3" type="audio/mpeg">
    </audio>
    <audio id="eliminatedAudio" preload="auto">
        <source src="../audio/eliminated.mp3" type="audio/mpeg">
    </audio>
    <audio id="lockInAudio" preload="auto">
        <source src="../audio/lock_in.mp3" type="audio/mpeg">
    </audio>
    <audio id="suspenseAudio" preload="auto">
        <source src="../audio/suspense.mp3" type="audio/mpeg">
    </audio>

    <script src="spectator.js"></script>
</body>
</html>
