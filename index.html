<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Game Display</title>
  <style>
    /* 1. Nền màn hình Display sử dụng Picture1.jpg */
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('Picture1.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      padding: 40px;
    }

    /* Ẩn hoàn toàn Bảng 100 người chơi */
    #player-board-100 {
      display: none !important;
    }

    /* 2. Khung Trợ giúp (Câu 1 khóa, từ Câu 2 mở) */
    .lifelines-container {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .lifeline-badge {
      padding: 10px 25px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid #a855f7;
      border-radius: 30px;
      font-weight: bold;
      font-size: 1.1rem;
      backdrop-filter: blur(5px);
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
      transition: all 0.4s ease;
    }

    .lifeline-badge.disabled {
      opacity: 0.3;
      filter: grayscale(100%);
      border-color: #666;
      box-shadow: none;
    }

    /* 3. Animation Chọn chủ đề */
    @keyframes wipeDownCenter {
      0% {
        transform: translateY(-100%);
        opacity: 0;
        clip-path: inset(0 0 100% 0);
      }
      100% {
        transform: translateY(0);
        opacity: 1;
        clip-path: inset(0 0 0 0);
      }
    }

    @keyframes zoomOut {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      100% {
        transform: scale(0);
        opacity: 0;
      }
    }

    #topics-container {
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 200px;
    }

    .topic-card {
      width: 220px;
      height: 120px;
      background: linear-gradient(135deg, #4c1d95, #7e22ce);
      border: 2px solid #c084fc;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    .topic-card.selected {
      animation: wipeDownCenter 0.8s ease-in-out forwards;
      border-color: #00f0ff;
      box-shadow: 0 0 30px #00f0ff;
    }

    .topic-card.unselected {
      animation: zoomOut 0.6s ease-in-out forwards;
    }

    /* 4. Khung Màn hình Câu hỏi & 3 Đáp án */
    .question-box {
      width: 80%;
      max-width: 900px;
      background: rgba(15, 23, 42, 0.75);
      border: 2px solid #a855f7;
      border-radius: 20px;
      padding: 30px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      text-align: center;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .question-box.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.95);
    }

    .question-text {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 30px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    /* Bố trí 3 nút đáp án */
    .answers-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .btn-answer {
      width: 100%;
      padding: 18px 25px;
      background: rgba(30, 41, 59, 0.8);
      border: 2px solid #38bdf8;
      border-radius: 12px;
      color: #fff;
      font-size: 1.3rem;
      font-weight: bold;
      text-align: left;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }
  </style>
</head>
<body>

  <!-- KHU VỰC QUYỀN TRỢ GIÚP (Bắt đầu khóa ở Câu 1) -->
  <div class="lifelines-container">
    <div class="lifeline-badge disabled" id="disp-help-5050">Trợ giúp 50:50</div>
    <div class="lifeline-badge disabled" id="disp-help-audience">Hỏi ý kiến khán giả</div>
  </div>

  <!-- KHU VỰC NỔI BẬT CHỦ ĐỀ -->
  <div id="topics-container">
    <div class="topic-card" id="disp-topic-1">Chủ đề 1</div>
    <div class="topic-card" id="disp-topic-2">Chủ đề 2</div>
    <div class="topic-card" id="disp-topic-3">Chủ đề 3</div>
  </div>

  <!-- KHU VỰC CÂU HỎI & 3 NÚT ĐÁP ÁN -->
  <div id="disp-question-container" class="question-box hidden">
    <div class="question-text" id="disp-question-title">Chờ tải câu hỏi...</div>
    
    <div class="answers-group">
      <div class="btn-answer" id="disp-ans-a">A. Đáp án 1</div>
      <div class="btn-answer" id="disp-ans-b">B. Đáp án 2</div>
      <div class="btn-answer" id="disp-ans-c">C. Đáp án 3</div>
    </div>
  </div>

  <script>
    // Kênh kết nối Realtime giữa Controller và Display
    const channel = new BroadcastChannel('game_control_channel');

    // Lắng nghe sự kiện truyền từ Controller
    channel.onmessage = (event) => {
      const data = event.data;

      switch (data.type) {
        case 'LOAD_QUESTION':
          renderQuestion(data.question, data.index);
          break;

        case 'HIDE_QUESTION':
          document.getElementById('disp-question-container').classList.add('hidden');
          break;

        case 'SELECT_TOPIC':
          triggerTopicAnimation(data.selectedId);
          break;

        case 'USE_HELP':
          if (data.helpType === '5050') {
            document.getElementById('disp-help-5050').style.opacity = '0.2';
          } else if (data.helpType === 'audience') {
            document.getElementById('disp-help-audience').style.opacity = '0.2';
          }
          break;
      }
    };

    // Render Câu hỏi và Điều khiển Trợ giúp theo số câu
    function renderQuestion(q, index) {
      document.getElementById('disp-question-title').innerText = `Câu ${index + 1}: ${q.CauHoi}`;
      document.getElementById('disp-ans-a').innerText = `A. ${q.DapAnA}`;
      document.getElementById('disp-ans-b').innerText = `B. ${q.DapAnB}`;
      document.getElementById('disp-ans-c').innerText = `C. ${q.DapAnC}`;

      // Hiển thị khung câu hỏi
      document.getElementById('disp-question-container').classList.remove('hidden');

      // Cập nhật Quyền trợ giúp: Khóa ở câu đầu tiên (index = 0), Mở từ câu 2 (index >= 1)
      const isFirstQuestion = (index === 0);
      const helpBadges = document.querySelectorAll('.lifeline-badge');
      
      helpBadges.forEach(badge => {
        if (isFirstQuestion) {
          badge.classList.add('disabled');
        } else {
          badge.classList.remove('disabled');
        }
      });
    }

    // Animation Chủ đề: Selected -> wipeDownCenter, Unselected -> zoomOut
    function triggerTopicAnimation(selectedId) {
      for (let i = 1; i <= 3; i++) {
        const topicEl = document.getElementById(`disp-topic-${i}`);
        if (i === selectedId) {
          topicEl.classList.remove('unselected');
          topicEl.classList.add('selected');
        } else {
          topicEl.classList.remove('selected');
          topicEl.classList.add('unselected');
        }
      }
    }
  </script>
</body>
</html>
