
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Een Tegen 100 - Interactive Game Show</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <!-- Header -->
        <header class="game-header">
            <div class="header-content">
                <h1>EEN TEGEN 100</h1>
                <p class="subtitle">Interactive Game Show</p>
            </div>
            <div class="score-display">
                <div class="score-item">
                    <span class="label">Vragen</span>
                    <span class="value" id="questionCount">1/10</span>
                </div>
                <div class="score-item">
                    <span class="label">Prijs</span>
                    <span class="value" id="prizeAmount">€500</span>
                </div>
            </div>
        </header>

        <!-- Main Game Area -->
        <div class="game-main">
            <!-- Contestant Display -->
            <div class="contestant-section">
                <div class="contestant-card">
                    <div class="contestant-avatar">🧑</div>
                    <div class="contestant-info">
                        <h2 id="contestantName">Contestant</h2>
                        <p id="contestantLives">❤️ ❤️ ❤️</p>
                    </div>
                </div>
            </div>

            <!-- The 100 People Display -->
            <div class="people-section">
                <h3>De 100</h3>
                <div class="people-grid" id="peopleGrid">
                    <!-- Grid of 100 people will be generated by JavaScript -->
                </div>
                <div class="people-stats">
                    <span>Aktief: <strong id="activePeople">100</strong></span>
                    <span>Uitgevallen: <strong id="eliminatedPeople">0</strong></span>
                </div>
            </div>

            <!-- Question Section -->
            <div class="question-section">
                <div class="question-card">
                    <h3>Vraag</h3>
                    <p id="questionText" class="question-text">Click "Start Game" to begin</p>
                    
                    <div class="options-container" id="optionsContainer">
                        <button class="option-btn" data-option="A">
                            <span class="option-letter">A</span>
                            <span class="option-text">Optie A</span>
                        </button>
                        <button class="option-btn" data-option="B">
                            <span class="option-letter">B</span>
                            <span class="option-text">Optie B</span>
                        </button>
                        <button class="option-btn" data-option="C">
                            <span class="option-letter">C</span>
                            <span class="option-text">Optie C</span>
                        </button>
                        <button class="option-btn" data-option="D">
                            <span class="option-letter">D</span>
                            <span class="option-text">Optie D</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <div class="game-controls">
                <button id="startBtn" class="control-btn btn-primary">Start Game</button>
                <button id="nextBtn" class="control-btn btn-secondary" disabled>Next Question</button>
                <button id="eliminateBtn" class="control-btn btn-danger" disabled>Eliminate Wrong Answers</button>
                <button id="resetBtn" class="control-btn btn-reset">Reset Game</button>
            </div>
            
            <div class="answer-display">
                <div class="answer-info">
                    <label>Correct Answer:</label>
                    <input type="text" id="correctAnswerInput" placeholder="A" maxlength="1">
                </div>
                <div class="answer-info">
                    <label>Contestant Answer:</label>
                    <input type="text" id="contestantAnswerInput" placeholder="A" maxlength="1">
                </div>
                <button id="submitAnswerBtn" class="control-btn btn-primary" disabled>Submit Answer</button>
            </div>

            <div class="question-setup">
                <label>Question Text:</label>
                <textarea id="questionInput" placeholder="Enter question..."></textarea>
                <div class="options-setup">
                    <div class="option-setup">
                        <label>Option A:</label>
                        <input type="text" id="optionA" placeholder="">
                    </div>
                    <div class="option-setup">
                        <label>Option B:</label>
                        <input type="text" id="optionB" placeholder="">
                    </div>
                    <div class="option-setup">
                        <label>Option C:</label>
                        <input type="text" id="optionC" placeholder="">
                    </div>
                    <div class="option-setup">
                        <label>Option D:</label>
                        <input type="text" id="optionD" placeholder="">
                    </div>
                </div>
                <button id="loadQuestionBtn" class="control-btn btn-primary">Load Question</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
