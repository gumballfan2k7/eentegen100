<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Een Tegen 100 - Interactive Game Show</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Category Selection Screen -->
    <div id="categoryScreen" class="screen active">
        <div class="background-overlay"></div>
        <div class="category-container">
            <div class="header">
                <h1>EEN TEGEN 100</h1>
                <p>Kies een categorie</p>
            </div>
            <div class="categories-grid" id="categoriesGrid">
                <!-- Categories will be loaded from JSON -->
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="screen">
        <div class="game-background"></div>
        <div class="game-container">
            <!-- Header -->
            <header class="game-header">
                <div class="header-content">
                    <h1>EEN TEGEN 100</h1>
                    <p class="category-name" id="categoryName">Category</p>
                </div>
                <div class="score-display">
                    <div class="score-item">
                        <span class="label">Vraag</span>
                        <span class="value" id="questionNumber">1/10</span>
                    </div>
                    <div class="score-item">
                        <span class="label">Prijs</span>
                        <span class="value" id="prizeAmount">€500</span>
                    </div>
                </div>
            </header>

            <!-- Main Game Area -->
            <div class="game-main">
                <!-- Contestant Display -->
                <div class="contestant-section">
                    <div class="contestant-card">
                        <div class="contestant-avatar">🧑</div>
                        <div class="contestant-info">
                            <h2>Deelnemer</h2>
                            <p class="lives" id="contestantLives">❤️ ❤️ ❤️</p>
                        </div>
                    </div>
                </div>

                <!-- The 100 People Display -->
                <div class="people-section">
                    <h3>De 100</h3>
                    <div class="people-grid" id="peopleGrid"></div>
                    <div class="people-stats">
                        <span>In-spel: <strong id="activePeople">100</strong></span>
                        <span>Uitgevallen: <strong id="eliminatedPeople">0</strong></span>
                    </div>
                </div>

                <!-- Question Section -->
                <div class="question-section">
                    <div class="question-card">
                        <p id="questionText" class="question-text">Wacht op vraag...</p>
                        <div class="options-container" id="optionsContainer">
                            <button class="option-btn" data-option="A">
                                <span class="option-letter">A</span>
                                <span class="option-text">Optie</span>
                            </button>
                            <button class="option-btn" data-option="B">
                                <span class="option-letter">B</span>
                                <span class="option-text">Optie</span>
                            </button>
                            <button class="option-btn" data-option="C">
                                <span class="option-letter">C</span>
                                <span class="option-text">Optie</span>
                            </button>
                            <button class="option-btn" data-option="D">
                                <span class="option-letter">D</span>
                                <span class="option-text">Optie</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Control Panel -->
            <div class="control-panel">
                <div class="controls-group">
                    <button id="startGameBtn" class="btn btn-primary">Start Quiz</button>
                    <button id="nextQuestionBtn" class="btn btn-secondary" disabled>Volgende Vraag</button>
                    <button id="showAnswerBtn" class="btn btn-success" disabled>Toon Antwoord</button>
                    <button id="backCategoryBtn" class="btn btn-back">Terug naar Categorieën</button>
                </div>

                <div class="answer-input-group">
                    <label>Correct Antwoord:</label>
                    <div class="input-wrapper">
                        <input type="text" id="correctAnswerInput" maxlength="1" placeholder="A-D">
                        <button id="submitAnswerBtn" class="btn btn-submit" disabled>✓</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
