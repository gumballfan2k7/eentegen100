<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Màn Hình Hiển Thị - Đấu Trường 100</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #3c1962 0%, #1a0833 70%, #0c0317 100%);
            --card-bg: #2a113a;
            --card-selected: #5a2680;
            --card-correct: #1b7e36;
            --card-wrong: #ab1a1a;
            --text-main: #f5edff;
            --badge-bg: #4a1f68;
            --accent-yellow: #ffd700;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            width: 100vw; height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Roboto Condensed', sans-serif;
            color: var(--text-main);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            overflow: hidden; position: relative;
        }

        /* BẢNG 100 NGƯỜI CHƠI */
        .grid-container {
            width: 900px; margin-bottom: 20px;
            background: rgba(20, 8, 35, 0.7);
            padding: 12px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .grid-100 { display: grid; grid-template-columns: repeat(20, 1fr); gap: 4px; }
        .player-spot {
            background: #ffea00; height: 16px; border-radius: 3px;
            box-shadow: 0 0 6px rgba(255, 234, 0, 0.6); transition: all 0.3s;
        }
        .player-spot.eliminated { background: #190a28; box-shadow: inset 0 0 4px #000; border: 1px solid rgba(255,255,255,0.05); }

        /* MÀN HÌNH CHỦ ĐỀ (HÌNH 3) */
        .topic-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 3, 20, 0.92); backdrop-filter: blur(8px);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            gap: 25px; z-index: 90; animation: fadeIn 0.4s ease-out;
        }
        .topic-card {
            width: 700px; height: 110px;
            background: linear-gradient(180deg, #b062ff 0%, #7622d7 100%);
            border-radius: 20px; padding: 12px;
            box-shadow: 0 10px 30px rgba(118, 34, 215, 0.4);
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .topic-card-inner {
            width: 100%; height: 100%; background: #1d072e; border-radius: 14px;
            display: flex; justify-content: center; align-items: center;
            font-size: 38px; font-weight: 900; letter-spacing: 2px; color: #ffffff; text-transform: uppercase;
        }
        .topic-card.active { transform: scale(1.05); box-shadow: 0 0 35px #00e5ff; background: linear-gradient(180deg, #00f2fe 0%, #4facfe 100%); }

        /* KHUNG CHÍNH GAME */
        .main-game { width: 950px; display: flex; flex-direction: column; gap: 15px; position: relative; }
        .tabs-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: -1px; z-index: 5; padding: 0 20px; opacity: 0; transition: opacity 0.5s; }
        .tabs-header.visible { opacity: 1; }
        .tab-vs { background: var(--card-bg); padding: 10px 30px; font-size: 24px; font-weight: 900; color: #d1b3f0; border-radius: 14px 14px 0 0; }
        .tab-vs span { color: var(--accent-yellow); }
        .tab-lifelines { background: var(--card-bg); padding: 10px 25px; font-size: 22px; font-weight: 900; display: flex; gap: 25px; border-radius: 14px 14px 0 0; }
        .lifeline-item { color: #2c5e2e; transition: color 0.3s; }
        .lifeline-item.active { color: #39ff14; text-shadow: 0 0 8px rgba(57, 255, 20, 0.6); }

        /* CÂU HỎI & ANIMATION WIPE UP */
        .question-box {
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.12); border-radius: 16px;
            padding: 35px 30px; font-size: 30px; font-weight: 700; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); min-height: 120px;
            display: flex; justify-content: center; align-items: center; z-index: 4;
            opacity: 0; transform: translateY(50px); transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .question-box.wipe-up { opacity: 1; transform: translateY(0); }

        /* ĐÁP ÁN & ANIMATION WIPE DOWN */
        .answers-grid { display: flex; gap: 15px; }
        .answer-card {
            flex: 1; background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
            padding: 25px 15px; font-size: 24px; font-weight: 700; text-align: center; position: relative;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3); text-transform: uppercase;
            opacity: 0; transform: translateY(-40px); transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .answer-card.wipe-down { opacity: 1; transform: translateY(0); }
        .answer-badge {
            position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
            width: 32px; height: 32px; background: var(--badge-bg); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 18px; font-weight: 900; color: #d1b3f0;
        }
        .answer-card.selected { background: var(--card-selected) !important; border-color: #ba68c8 !important; box-shadow: 0 0 20px rgba(186, 104, 200, 0.6) !important; transform: scale(1.02); }
        .answer-card.correct { background: var(--card-correct) !important; border-color: #00ff66 !important; color: #fff !important; box-shadow: 0 0 30px rgba(0, 255, 102, 0.8) !important; transform: scale(1.03); }
        .answer-card.wrong { background: var(--card-wrong) !important; border-color: #ff3333 !important; color: #fff !important; box-shadow: 0 0 25px rgba(255, 51, 51, 0.8) !important; }

        /* MÀN ĐẾM SỐ NGƯỜI THUA (HÌNH 1 & HÌNH 2) */
        .wrong-counter-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(12, 3, 23, 0.95); display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .counter-card {
            width: 750px; height: 380px; border-radius: 35px;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.6); transition: background-color 0.4s;
        }
        .counter-card.purple-mode { background: linear-gradient(135deg, #a81fe3 0%, #6b0cb5 100%); }
        .counter-card.red-mode { background: linear-gradient(135deg, #d30000 0%, #990000 100%); }
        .counter-number { font-size: 220px; font-weight: 900; color: #ffffff; line-height: 1; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="grid-container"><div class="grid-100" id="grid-100"></div></div>

    <!-- HÌNH 3: MÀN CHỦ ĐỀ -->
    <div class="topic-screen" id="topic-screen">
        <div class="topic-card" id="topic-card-1"><div class="topic-card-inner" id="topic-text-1">ÂM NHẠC</div></div>
        <div class="topic-card" id="topic-card-2"><div class="topic-card-inner" id="topic-text-2">PHIM ẢNH</div></div>
    </div>

    <!-- HÌNH 1 & HÌNH 2: MÀN ĐẾM -->
    <div class="wrong-counter-overlay" id="counter-overlay">
        <div class="counter-card purple-mode" id="counter-card">
            <div class="counter-number" id="counter-val">0</div>
        </div>
    </div>

    <div class="main-game">
        <div class="tabs-header" id="tabs-header">
            <div class="tab-vs">1 ĐẤU <span id="disp-player-count">100</span></div>
            <div class="tab-lifelines">
                <span class="lifeline-item" id="ll-25">25%</span>
                <span class="lifeline-item" id="ll-50">50%</span>
                <span class="lifeline-item" id="ll-75">75%</span>
            </div>
        </div>

        <div class="question-box" id="disp-question">CÂU HỎI SẼ HIỂN THỊ TẠI ĐÂY</div>

        <div class="answers-grid">
            <div class="answer-card" id="ans-card-A"><div class="answer-badge">A</div><span id="disp-ans-a">ĐÁP ÁN A</span></div>
            <div class="answer-card" id="ans-card-B"><div class="answer-badge">B</div><span id="disp-ans-b">ĐÁP ÁN B</span></div>
            <div class="answer-card" id="ans-card-C"><div class="answer-badge">C</div><span id="disp-ans-c">ĐÁP ÁN C</span></div>
        </div>
    </div>

    <script>
        let playersState = JSON.parse(localStorage.getItem('dt100_players')) || Array(100).fill(true);
        const gridEl = document.getElementById('grid-100');

        function initGrid() {
            gridEl.innerHTML = '';
            for (let i = 0; i < 100; i++) {
                let spot = document.createElement('div');
                spot.className = 'player-spot' + (playersState[i] ? '' : ' eliminated');
                spot.id = 'spot-' + i;
                gridEl.appendChild(spot);
            }
            updatePlayerCountText();
        }

        function updatePlayerCountText() {
            let aliveCount = playersState.filter(p => p === true).length;
            document.getElementById('disp-player-count').innerText = aliveCount;
        }
        initGrid();

        window.addEventListener('storage', (e) => {
            if (e.key === 'dt100_cmd') handleCommand(JSON.parse(e.newValue));
        });

        function handleCommand(cmd) {
            if (!cmd) return;
            switch(cmd.type) {
                case 'SHOW_TOPICS':
                    document.getElementById('topic-text-1').innerText = cmd.topic1 || "ÂM NHẠC";
                    document.getElementById('topic-text-2').innerText = cmd.topic2 || "PHIM ẢNH";
                    document.getElementById('topic-card-1').classList.remove('active');
                    document.getElementById('topic-card-2').classList.remove('active');
                    document.getElementById('topic-screen').style.display = 'flex';
                    break;
                case 'SELECT_TOPIC':
                    if (cmd.index === 1) document.getElementById('topic-card-1').classList.add('active');
                    if (cmd.index === 2) document.getElementById('topic-card-2').classList.add('active');
                    setTimeout(() => { document.getElementById('topic-screen').style.display = 'none'; }, 1200);
                    break;
                case 'LOAD_QUESTION':
                    document.getElementById('disp-question').innerText = cmd.data.question;
                    document.getElementById('disp-ans-a').innerText = cmd.data.ansA;
                    document.getElementById('disp-ans-b').innerText = cmd.data.ansB;
                    document.getElementById('disp-ans-c').innerText = cmd.data.ansC;
                    document.getElementById('disp-question').classList.remove('wipe-up');
                    ['A', 'B', 'C'].forEach(k => document.getElementById('ans-card-' + k).classList.remove('wipe-down', 'selected', 'correct', 'wrong'));
                    break;
                case 'SHOW_HEADER':
                    document.getElementById('tabs-header').classList.add('visible');
                    break;
                case 'SHOW_QUESTION':
                    document.getElementById('disp-question').classList.add('wipe-up');
                    break;
                case 'SHOW_ANSWER':
                    if (cmd.key === 'ALL') {
                        setTimeout(() => document.getElementById('ans-card-A').classList.add('wipe-down'), 0);
                        setTimeout(() => document.getElementById('ans-card-B').classList.add('wipe-down'), 250);
                        setTimeout(() => document.getElementById('ans-card-C').classList.add('wipe-down'), 500);
                    } else if (cmd.key) {
                        document.getElementById('ans-card-' + cmd.key).classList.add('wipe-down');
                    }
                    break;
                case 'TOGGLE_LIFELINE':
                    let el = document.getElementById('ll-' + cmd.value);
                    if(el) el.classList.toggle('active', cmd.status);
                    break;
                case 'PLAYER_SELECT':
                    ['A', 'B', 'C'].forEach(k => {
                        let card = document.getElementById('ans-card-' + k);
                        card.classList.toggle('selected', k === cmd.choice);
                    });
                    break;
                case 'REVEAL_RESULT':
                    ['A', 'B', 'C'].forEach(k => {
                        let card = document.getElementById('ans-card-' + k);
                        card.classList.remove('selected');
                        if (k === cmd.correct) card.classList.add('correct');
                        else if (k === cmd.chosen && cmd.chosen !== cmd.correct) card.classList.add('wrong');
                    });
                    break;
                case 'SHOW_ZERO_CARD':
                    document.getElementById('counter-card').className = 'counter-card purple-mode';
                    document.getElementById('counter-val').innerText = '0';
                    document.getElementById('counter-overlay').style.display = 'flex';
                    break;
                case 'RUN_ELIMINATION':
                    runEliminationAnimation(cmd.count);
                    break;
                case 'HIDE_COUNTER':
                    document.getElementById('counter-overlay').style.display = 'none';
                    break;
                case 'RESET_ALL':
                    playersState = Array(100).fill(true);
                    localStorage.setItem('dt100_players', JSON.stringify(playersState));
                    initGrid();
                    location.reload();
                    break;
            }
        }

        async function runEliminationAnimation(wrongCount) {
            let cardOverlay = document.getElementById('counter-overlay');
            let cardEl = document.getElementById('counter-card');
            let valEl = document.getElementById('counter-val');
            cardOverlay.style.display = 'flex';

            if (wrongCount === 0) {
                cardEl.className = 'counter-card purple-mode';
                valEl.innerText = '0';
                setTimeout(() => { cardOverlay.style.display = 'none'; }, 2000);
                return;
            }

            cardEl.className = 'counter-card red-mode';
            let aliveIndices = [];
            playersState.forEach((alive, idx) => { if(alive) aliveIndices.push(idx); });
            aliveIndices.sort(() => Math.random() - 0.5);

            let actualElim = Math.min(wrongCount, aliveIndices.length);
            for (let i = 1; i <= actualElim; i++) {
                valEl.innerText = i;
                let elimIndex = aliveIndices[i - 1];
                playersState[elimIndex] = false;
                document.getElementById('spot-' + elimIndex).classList.add('eliminated');
                updatePlayerCountText();
                localStorage.setItem('dt100_players', JSON.stringify(playersState));
                await new Promise(res => setTimeout(res, 350));
            }
            setTimeout(() => { cardOverlay.style.display = 'none'; }, 2500);
        }
    </script>
</body>
</html>
