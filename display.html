<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Show - Display Stage</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Bahnschrift', 'Segoe UI', sans-serif !important;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, #2e1254 0%, #0d0618 100%);
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .screen-container {
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0;
            left: 0;
        }

        .screen-container.active {
            display: flex;
        }

        /* 1. HIỂN THỊ CHỦ ĐỀ */
        .topics-wrapper {
            display: flex;
            gap: 60px;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .topic-card {
            background: linear-gradient(135deg, #6b21a8, #3b0764);
            border: 4px solid #c084fc;
            border-radius: 24px;
            padding: 40px 70px;
            font-size: 2.8rem;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            min-width: 320px;
        }

        .topic-card.selected {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(1.3);
            z-index: 10;
            box-shadow: 0 0 60px #a855f7;
            background: linear-gradient(135deg, #9333ea, #581c87);
        }

        .topic-card.zoom-out {
            transform: scale(0);
            opacity: 0;
            pointer-events: none;
        }

        /* 2. KHUNG CÂU HỎI VÀ THẺ TIÊU ĐỀ */
        .qa-wrapper {
            width: 90%;
            max-width: 1150px;
            display: flex;
            flex-direction: column;
            gap: 35px;
            position: relative;
        }

        .question-container {
            position: relative;
            margin-top: 35px;
        }

        .tab-left {
            position: absolute;
            top: -36px;
            left: 30px;
            background: #3b1859;
            border: 2px solid #a855f7;
            border-bottom: none;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            padding: 6px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #e0aaff;
            letter-spacing: 1px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
            z-index: 2;
        }

        .tab-right {
            position: absolute;
            top: -36px;
            right: 30px;
            background: #23103c;
            border: 2px solid #5b21b6;
            border-bottom: none;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            padding: 6px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            gap: 18px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
            z-index: 2;
        }

        .lifeline-val {
            color: #4ade80;
            transition: color 0.4s, opacity 0.4s;
        }

        .lifeline-val.used {
            color: #4b5563 !important;
            opacity: 0.4;
        }

        .question-box {
            background: linear-gradient(135deg, #3b1859, #23103c);
            border: 3px solid #a855f7;
            border-radius: 20px;
            padding: 35px 40px;
            font-size: 2.2rem;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: none;
        }

        @keyframes wipeUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .question-box.wipe-up {
            display: block;
            animation: wipeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* 3. ĐÁP ÁN (ĐÃ SỬA LỖI CẮT CHỮ A, B, C & THÊM TRẠNG THÁI MÀU ĐỎ SAI) */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px; /* Thêm lề trên để nhãn A, B, C không bị che */
        }

        .option-card {
            position: relative;
            background: linear-gradient(180deg, #2a1147 0%, #160829 100%);
            border: 2px solid #581c87;
            border-radius: 16px;
            padding: 32px 20px 24px 20px;
            font-size: 1.5rem;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            overflow: visible !important; /* Đảm bảo nhãn không bị cắt */
        }

        @keyframes wipeDown {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .option-card.wipe-down {
            display: flex;
            animation: wipeDown 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Định dạng thẻ A, B, C chuẩn mép trên */
        .option-prefix {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            background: #581c87;
            border: 2px solid #a855f7;
            border-bottom: none;
            color: #ffffff;
            padding: 2px 22px;
            border-radius: 10px 10px 0 0;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            z-index: 5;
            line-height: 1.2;
        }

        /* Trạng thái 1: Người chơi chọn (Màu cam) */
        .option-card.player-selected {
            background: linear-gradient(180deg, #b45309 0%, #78350f 100%) !important;
            border-color: #f59e0b !important;
            box-shadow: 0 0 35px #f59e0b;
        }
        .option-card.player-selected .option-prefix {
            background: #f59e0b !important;
            color: #000000 !important;
            border-color: #fef08a !important;
        }

        /* Trạng thái 2: Đáp án Đúng (Màu xanh lá) */
        .option-card.correct {
            background: linear-gradient(180deg, #15803d 0%, #0f5127 100%) !important;
            border-color: #22c55e !important;
            box-shadow: 0 0 35px #22c55e;
        }
        .option-card.correct .option-prefix {
            background: #22c55e !important;
            color: #000000 !important;
            border-color: #86efac !important;
        }

        /* Trạng thái 3: Đáp án Sai người chơi lỡ chọn (Màu đỏ) */
        .option-card.wrong {
            background: linear-gradient(180deg, #991b1b 0%, #450a0a 100%) !important;
            border-color: #ef4444 !important;
            box-shadow: 0 0 35px #ef4444;
        }
        .option-card.wrong .option-prefix {
            background: #ef4444 !important;
            color: #ffffff !important;
            border-color: #fca5a5 !important;
        }

        /* 4. MÀN HÌNH BỊ LOẠI */
        .number-card {
            width: 80%;
            max-width: 850px;
            height: 450px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            transition: background-color 0.4s ease;
        }

        .number-card.purple { background-color: #7321a9; }
        .number-card.red { background-color: #be0000; }

        .number-card span {
            font-size: 16rem;
            font-weight: bold;
            color: #ffffff;
            line-height: 1;
        }
    </style>
</head>
<body>

    <!-- MÀN HÌNH CHỦ ĐỀ -->
    <div id="screen-topics" class="screen-container active">
        <div id="topics-wrapper" class="topics-wrapper"></div>
    </div>

    <!-- MÀN HÌNH CÂU HỎI & ĐÁP ÁN -->
    <div id="screen-qa" class="screen-container">
        <div class="qa-wrapper">
            <div class="question-container">
                <!-- Tiêu đề cập nhật số người còn lại -->
                <div id="tab-left-title" class="tab-left">1 ĐẤU 100</div>
                
                <div id="tab-right-lifelines" class="tab-right">
                    <span id="ll-25" class="lifeline-val">25%</span>
                    <span id="ll-50" class="lifeline-val">50%</span>
                    <span id="ll-75" class="lifeline-val">75%</span>
                </div>

                <div id="question-box" class="question-box"></div>
            </div>

            <!-- Khung đáp án 3 cột -->
            <div class="options-grid">
                <div id="opt-A" class="option-card">
                    <span class="option-prefix">A</span>
                    <span class="opt-text"></span>
                </div>
                <div id="opt-B" class="option-card">
                    <span class="option-prefix">B</span>
                    <span class="opt-text"></span>
                </div>
                <div id="opt-C" class="option-card">
                    <span class="option-prefix">C</span>
                    <span class="opt-text"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH ĐẾM SỐ NGƯỜI BỊ LOẠI -->
    <div id="screen-elimination" class="screen-container">
        <div id="number-card" class="number-card purple">
            <span id="eliminated-count-text">0</span>
        </div>
    </div>

    <script>
        const channel = new BroadcastChannel('game_show_channel');
        let pendingEliminatedCount = 0;
        let selectedPlayerKey = null;

        function setScreen(screenId) {
            document.querySelectorAll('.screen-container').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        channel.onmessage = function(event) {
            const data = event.data;

            // Cập nhật số người chơi còn lại
            if (data.action === 'UPDATE_PLAYER_COUNT') {
                document.getElementById('tab-left-title').innerText = `1 ĐẤU ${data.activeCount}`;
            }

            // 1. CHỦ ĐỀ
            else if (data.action === 'SHOW_TOPICS') {
                setScreen('screen-topics');
                const wrapper = document.getElementById('topics-wrapper');
                wrapper.innerHTML = '';
                data.topics.slice(0, 2).forEach(topic => {
                    const card = document.createElement('div');
                    card.className = 'topic-card';
                    card.dataset.topic = topic;
                    card.innerText = topic;
                    wrapper.appendChild(card);
                });
            } 
            else if (data.action === 'SELECT_TOPIC') {
                setScreen('screen-topics');
                document.querySelectorAll('.topic-card').forEach(card => {
                    if (card.dataset.topic === data.topicName) {
                        card.classList.remove('zoom-out');
                        card.classList.add('selected');
                    } else {
                        card.classList.remove('selected');
                        card.classList.add('zoom-out');
                    }
                });
            }

            // 2. TRỢ GIÚP
            else if (data.action === 'UPDATE_LIFELINES') {
                ['25', '50', '75'].forEach(val => {
                    const el = document.getElementById(`ll-${val}`);
                    if (data.used[val]) {
                        el.classList.add('used');
                    } else {
                        el.classList.remove('used');
                    }
                });
            }

            // 3. CÂU HỎI & ĐÁP ÁN
            else if (data.action === 'LOAD_QUESTION') {
                setScreen('screen-qa');
                selectedPlayerKey = null;

                const lifelineTab = document.getElementById('tab-right-lifelines');
                lifelineTab.style.display = data.isFirstQuestion ? 'none' : 'flex';

                const qBox = document.getElementById('question-box');
                qBox.classList.remove('wipe-up');
                qBox.innerText = data.questionData.question;

                ['A', 'B', 'C'].forEach(key => {
                    const opt = document.getElementById(`opt-${key}`);
                    opt.classList.remove('wipe-down', 'correct', 'wrong', 'player-selected');
                    opt.querySelector('.opt-text').innerText = data.questionData.options[key] || '';
                });
            }
            else if (data.action === 'ANIMATE_QUESTION') {
                setScreen('screen-qa');
                const qBox = document.getElementById('question-box');
                qBox.classList.remove('wipe-up');
                void qBox.offsetWidth;
                qBox.classList.add('wipe-up');
            }
            else if (data.action === 'ANIMATE_OPTION') {
                setScreen('screen-qa');
                const opt = document.getElementById(`opt-${data.key}`);
                if (opt) {
                    opt.classList.remove('wipe-down');
                    void opt.offsetWidth;
                    opt.classList.add('wipe-down');
                }
            }
            else if (data.action === 'SELECT_PLAYER_ANSWER') {
                selectedPlayerKey = data.key;
                ['A', 'B', 'C'].forEach(key => {
                    document.getElementById(`opt-${key}`).classList.remove('player-selected', 'wrong', 'correct');
                });
                const opt = document.getElementById(`opt-${data.key}`);
                if (opt) opt.classList.add('player-selected');
            }
            else if (data.action === 'SHOW_CORRECT_ANSWER') {
                // Hiển thị đáp án đúng (Màu Xanh)
                const correctOpt = document.getElementById(`opt-${data.correctKey}`);
                if (correctOpt) {
                    correctOpt.classList.remove('player-selected');
                    correctOpt.classList.add('correct');
                }

                // Nếu người chơi chọn sai, chuyển lựa chọn của người chơi sang Màu Đỏ
                if (selectedPlayerKey && selectedPlayerKey !== data.correctKey) {
                    const wrongOpt = document.getElementById(`opt-${selectedPlayerKey}`);
                    if (wrongOpt) {
                        wrongOpt.classList.remove('player-selected');
                        wrongOpt.classList.add('wrong');
                    }
                }
            }

            // 4. MÀN HÌNH ĐẾM SỐ NGƯỜI SAI
            else if (data.action === 'PREPARE_ELIMINATION') {
                setScreen('screen-elimination');
                pendingEliminatedCount = data.count;
                const card = document.getElementById('number-card');
                card.className = 'number-card purple';
                document.getElementById('eliminated-count-text').innerText = '0';
            }
            else if (data.action === 'REVEAL_ELIMINATION') {
                setScreen('screen-elimination');
                const card = document.getElementById('number-card');
                const countText = document.getElementById('eliminated-count-text');

                card.className = 'number-card red';
                let current = 0;
                const target = pendingEliminatedCount;

                if (target === 0) {
                    countText.innerText = '0';
                    return;
                }

                function step() {
                    if (current < target) {
                        current++;
                        countText.innerText = current;
                        const randomInterval = Math.floor(Math.random() * 450) + 80;
                        setTimeout(step, randomInterval);
                    }
                }
                step();
            }
        };
    </script>
</body>
</html>
