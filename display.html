<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Show - Display</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Bahnschrift', 'Segoe UI', sans-serif !important;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, #2e1254 0%, #0d0618 100%);
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 1. KHU VỰC CHỦ ĐỀ */
        .topics-container {
            display: flex;
            gap: 25px;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .topic-card {
            background: linear-gradient(135deg, #6b21a8, #3b0764);
            border: 3px solid #c084fc;
            border-radius: 20px;
            padding: 35px 55px;
            font-size: 2.2rem;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Chủ đề được chọn: Move to Center & Phóng to */
        .topic-card.selected {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(1.35);
            z-index: 10;
            box-shadow: 0 0 50px #a855f7;
            background: linear-gradient(135deg, #9333ea, #581c87);
        }

        /* Chủ đề không được chọn: Zoom out & Mờ dần */
        .topic-card.zoom-out {
            transform: scale(0);
            opacity: 0;
            pointer-events: none;
        }

        /* 2. MÀN HÌNH BỊ LOẠI (HÌNH 1 & HÌNH 2) */
        .elimination-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .number-card {
            width: 80%;
            max-width: 850px;
            height: 450px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            transition: background-color 0.4s ease;
        }

        /* Tím (Khởi tạo/Hình 1) */
        .number-card.purple {
            background-color: #7321a9;
        }

        /* Đỏ (Hiển thị số bị loại/Hình 2) */
        .number-card.red {
            background-color: #be0000;
        }

        .number-card span {
            font-size: 16rem;
            font-weight: bold;
            color: #ffffff;
            line-height: 1;
            user-select: none;
        }
    </style>
</head>
<body>

    <!-- KHU VỰC CHỦ ĐỀ -->
    <div id="topics-display" class="topics-container"></div>

    <!-- KHU VỰC SỐ NGƯỜI BỊ LOẠI -->
    <div id="elimination-display" class="elimination-screen">
        <div id="number-card" class="number-card purple">
            <span id="eliminated-count-text">0</span>
        </div>
    </div>

    <script>
        const channel = new BroadcastChannel('game_show_channel');

        // LẮNG NGHE TÍN HIỆU TỪ CONTROLLER
        channel.onmessage = function(event) {
            const data = event.data;

            if (data.action === 'RENDER_TOPICS') {
                renderTopics(data.topics);
            } else if (data.action === 'SELECT_TOPIC') {
                selectTopic(data.topicName);
            } else if (data.action === 'RESET_TOPICS') {
                resetTopics();
            } else if (data.action === 'SHOW_ELIMINATION') {
                showElimination(data.count);
            }
        };

        function renderTopics(topics) {
            showScreen('topics');
            const container = document.getElementById('topics-display');
            container.innerHTML = '';
            topics.forEach(topic => {
                const card = document.createElement('div');
                card.className = 'topic-card';
                card.dataset.topic = topic;
                card.innerText = topic;
                container.appendChild(card);
            });
        }

        function selectTopic(topicName) {
            showScreen('topics');
            const cards = document.querySelectorAll('.topic-card');
            cards.forEach(card => {
                if (card.dataset.topic === topicName) {
                    card.classList.remove('zoom-out');
                    card.classList.add('selected');
                } else {
                    card.classList.remove('selected');
                    card.classList.add('zoom-out');
                }
            });
        }

        function resetTopics() {
            showScreen('topics');
            const cards = document.querySelectorAll('.topic-card');
            cards.forEach(card => {
                card.classList.remove('selected', 'zoom-out');
            });
        }

        function showElimination(targetNumber) {
            showScreen('elimination');
            const card = document.getElementById('number-card');
            const countText = document.getElementById('eliminated-count-text');

            // Trạng thái ban đầu: Thẻ tím, số 0 (Hình 1)
            card.className = 'number-card purple';
            countText.innerText = '0';

            if (targetNumber === 0) return;

            // Chuyển sang thẻ đỏ (Hình 2) và nhảy số không theo nhịp
            setTimeout(() => {
                card.className = 'number-card red';
                
                let current = 0;
                function step() {
                    if (current < targetNumber) {
                        current++;
                        countText.innerText = current;

                        // Tốc độ nhảy ngẫu nhiên không theo nhịp (100ms - 600ms)
                        const randomInterval = Math.floor(Math.random() * 500) + 100;
                        setTimeout(step, randomInterval);
                    }
                }
                step();
            }, 600);
        }

        function showScreen(screenName) {
            if (screenName === 'topics') {
                document.getElementById('topics-display').style.display = 'flex';
                document.getElementById('elimination-display').style.display = 'none';
            } else {
                document.getElementById('topics-display').style.display = 'none';
                document.getElementById('elimination-display').style.display = 'flex';
            }
        }
    </script>
</body>
</html>
