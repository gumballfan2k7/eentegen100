<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Show - Display Stage</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Bahnschrift', 'Segoe UI', sans-serif !important;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, #2e1254 0%, #0d0618 100%);
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .screen-container {
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0;
            left: 0;
        }

        .screen-container.active {
            display: flex;
        }

        /* 1. ANIMATION CHỦ ĐỀ DỌC */
        .topics-wrapper {
            display: flex;
            flex-direction: column;
            gap: 24px;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            position: relative;
        }

        @keyframes topicPeekUp {
            0% { transform: translateY(40px) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        .topic-card {
            background: linear-gradient(180deg, #7e22ce 0%, #3b0764 100%);
            border: 3px solid #e9d5ff;
            border-radius: 18px;
            padding: 22px 0;
            width: 500px;
            font-size: 2.3rem;
            font-weight: 800;
            text-align: center;
            color: #ffffff;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.5), inset 0 0 12px rgba(233, 213, 255, 0.3);
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.3, 1), opacity 0.5s ease, box-shadow 0.5s ease;
            animation: topicPeekUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Khi chọn thẻ ở Trên -> Trượt xuống giữa */
        .topic-card.selected-top {
            transform: translateY(calc(50% + 12px)) scale(1.05) !important;
            box-shadow: 0 0 50px #c084fc, inset 0 0 20px #ffffff;
            z-index: 10;
        }

        /* Khi chọn thẻ ở Dưới -> Trượt lên giữa */
        .topic-card.selected-bottom {
            transform: translateY(calc(-50% - 12px)) scale(1.05) !important;
            box-shadow: 0 0 50px #c084fc, inset 0 0 20px #ffffff;
            z-index: 10;
        }

        /* Thẻ không được chọn -> Zoom out & Biến mất */
        .topic-card.zoom-out {
            transform: scale(0.6) !important;
            opacity: 0 !important;
            pointer-events: none;
        }

        /* 2. KHUNG CÂU HỎI & TAB */
        .qa-wrapper {
            width: 90%;
            max-width: 1150px;
            display: flex;
            flex-direction: column;
            gap: 35px;
            position: relative;
        }

        .question-container {
            position: relative;
            margin-top: 38px;
        }

        .tab-slot-wrapper {
            position: absolute;
            top: -38px;
            left: 20px;
            height: 38px;
            width: 200px;
            overflow: hidden;
            z-index: 3;
        }

        .tab-item {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 100%;
            width: 100%;
            padding: 0 16px;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            background: #1e0a38;
            border: 1px solid #4a1d75;
            border-bottom: none;
            color: #d8b4fe;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.4);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            transform: translateY(100%);
            opacity: 0;
        }

        .tab-item.show-up {
            transform: translateY(0);
            opacity: 1;
        }

        .tab-item.hidden-down {
            transform: translateY(100%);
            opacity: 0;
            pointer-events: none;
        }

        .tab-right {
            position: absolute;
            top: -38px;
            right: 20px;
            height: 38px;
            background: #1e0a38;
            border: 1px solid #4a1d75;
            border-bottom: none;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            padding: 0 20px;
            font-size: 1.05rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.4);
            z-index: 2;
            transform: translateY(100%);
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
        }

        .tab-right.show-up {
            transform: translateY(0);
            opacity: 1;
        }

        .lifeline-val {
            color: #4ade80;
            transition: color 0.3s ease;
        }

        .lifeline-val.used {
            color: #71717a !important;
            text-decoration: none !important;
            opacity: 1 !important;
        }

        .question-box {
            background: linear-gradient(135deg, #3b1859, #23103c);
            border: 3px solid #a855f7;
            border-radius: 20px;
            padding: 35px 40px;
            font-size: 2.2rem;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: none;
        }

        @keyframes wipeUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .question-box.wipe-up {
            display: block;
            animation: wipeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* 3. ĐÁP ÁN */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .option-card {
            position: relative;
            background: linear-gradient(180deg, #2a1147 0%, #160829 100%);
            border: 2px solid #581c87;
            border-radius: 16px;
            padding: 32px 20px 24px 20px;
            font-size: 1.5rem;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            overflow: visible !important;
        }

        @keyframes wipeDown {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .option-card.wipe-down {
            display: flex;
            animation: wipeDown 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .option-prefix {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            background: #581c87;
            border: 2px solid #a855f7;
            border-bottom: none;
            color: #ffffff;
            padding: 2px 22px;
            border-radius: 10px 10px 0 0;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            z-index: 5;
            line-height: 1.2;
        }

        .option-card.player-selected {
            background: linear-gradient(180deg, #7e22ce 0%, #4c1d95 100%) !important;
            border-color: #c084fc !important;
            box-shadow: 0 0 35px #c084fc !important;
        }
        .option-card.player-selected .option-prefix {
            background: #c084fc !important;
            color: #1e1b4b !important;
            border-color: #e9d5ff !important;
        }

        .option-card.correct {
            background: linear-gradient(180deg, #15803d 0%, #0f5127 100%) !important;
            border-color: #22c55e !important;
            box-shadow: 0 0 35px #22c55e !important;
        }
        .option-card.correct .option-prefix {
            background: #22c55e !important;
            color: #000000 !important;
            border-color: #86efac !important;
        }

        .option-card.wrong {
            background: linear-gradient(180deg, #991b1b 0%, #450a0a 100%) !important;
            border-color: #ef4444 !important;
            box-shadow: 0 0 35px #ef4444 !important;
        }
        .option-card.wrong .option-prefix {
            background: #ef4444 !important;
            color: #ffffff !important;
            border-color: #fca5a5 !important;
        }

        /* MÀN HÌNH LOẠI */
        .number-card {
            width: 80%;
            max-width: 850px;
            height: 450px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            transition: background-color 0.4s ease;
        }
        .number-card.purple { background-color: #7321a9; }
        .number-card.red { background-color: #be0000; }
        .number-card span { font-size: 16rem; font-weight: bold; color: #ffffff; line-height: 1; }
    </style>
</head>
<body>

    <!-- MÀN HÌNH CHỦ ĐỀ -->
    <div id="screen-topics" class="screen-container active">
        <div id="topics-wrapper" class="topics-wrapper"></div>
    </div>

    <!-- MÀN HÌNH CÂU HỎI -->
    <div id="screen-qa" class="screen-container">
        <div class="qa-wrapper">
            <div class="question-container">
                <div class="tab-slot-wrapper">
                    <div id="tab-left-title" class="tab-item">1 ĐẤU 100</div>
                    <div id="tab-score" class="tab-item">0</div>
                </div>
                
                <div id="tab-right-lifelines" class="tab-right">
                    <span id="ll-25" class="lifeline-val">25%</span>
                    <span id="ll-50" class="lifeline-val">50%</span>
                    <span id="ll-75" class="lifeline-val">75%</span>
                </div>

                <div id="question-box" class="question-box"></div>
            </div>

            <div class="options-grid">
                <div id="opt-A" class="option-card">
                    <span class="option-prefix">A</span>
                    <span class="opt-text"></span>
                </div>
                <div id="opt-B" class="option-card">
                    <span class="option-prefix">B</span>
                    <span class="opt-text"></span>
                </div>
                <div id="opt-C" class="option-card">
                    <span class="option-prefix">C</span>
                    <span class="opt-text"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH BỊ LOẠI -->
    <div id="screen-elimination" class="screen-container">
        <div id="number-card" class="number-card purple">
            <span id="eliminated-count-text">0</span>
        </div>
    </div>

    <script>
        const channel = new BroadcastChannel('game_show_channel');
        let pendingEliminatedCount = 0;
        let selectedPlayerKey = null;

        function setScreen(screenId) {
            document.querySelectorAll('.screen-container').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function loadQuestionData(questionData) {
            selectedPlayerKey = null;
            document.getElementById('tab-left-title').classList.remove('show-up');
            document.getElementById('tab-left-title').classList.add('hidden-down');
            document.getElementById('tab-score').classList.remove('show-up');
            document.getElementById('tab-score').classList.add('hidden-down');
            document.getElementById('tab-right-lifelines').classList.remove('show-up');

            const qBox = document.getElementById('question-box');
            qBox.classList.remove('wipe-up');
            qBox.innerText = questionData.question;

            ['A', 'B', 'C'].forEach(key => {
                const opt = document.getElementById(`opt-${key}`);
                opt.classList.remove('wipe-down', 'correct', 'wrong', 'player-selected');
                opt.querySelector('.option-prefix').innerText = key;
                opt.querySelector('.opt-text').innerText = questionData.options[key] || '';
            });
        }

        channel.onmessage = function(event) {
            const data = event.data;

            if (data.action === 'SHOW_TAB_1VS100') {
                const tabTitle = document.getElementById('tab-left-title');
                const tabScore = document.getElementById('tab-score');
                tabTitle.classList.remove('hidden-down');
                tabTitle.classList.add('show-up');
                tabScore.classList.remove('show-up');
                tabScore.classList.add('hidden-down');
            }
            else if (data.action === 'SHOW_TAB_SCORE') {
                const tabTitle = document.getElementById('tab-left-title');
                const tabScore = document.getElementById('tab-score');
                tabScore.classList.remove('hidden-down');
                tabScore.classList.add('show-up');
                tabTitle.classList.remove('show-up');
                tabTitle.classList.add('hidden-down');
            }
            else if (data.action === 'HIDE_ALL_TABS') {
                const tabTitle = document.getElementById('tab-left-title');
                const tabScore = document.getElementById('tab-score');
                tabTitle.classList.remove('show-up');
                tabTitle.classList.add('hidden-down');
                tabScore.classList.remove('show-up');
                tabScore.classList.add('hidden-down');
            }
            else if (data.action === 'TOGGLE_LIFELINES_TAB') {
                const lifelineTab = document.getElementById('tab-right-lifelines');
                if (data.show) {
                    lifelineTab.classList.add('show-up');
                } else {
                    lifelineTab.classList.remove('show-up');
                }
            }
            else if (data.action === 'UPDATE_SCORE') {
                document.getElementById('tab-score').innerText = data.score.toLocaleString('vi-VN');
            }
            else if (data.action === 'UPDATE_PLAYER_COUNT') {
                document.getElementById('tab-left-title').innerText = `1 ĐẤU ${data.activeCount}`;
            }
            else if (data.action === 'SHOW_TOPICS') {
                setScreen('screen-topics');
                const wrapper = document.getElementById('topics-wrapper');
                wrapper.innerHTML = '';
                data.topics.slice(0, 2).forEach(topic => {
                    const card = document.createElement('div');
                    card.className = 'topic-card';
                    card.dataset.topic = topic;
                    card.innerText = topic;
                    wrapper.appendChild(card);
                });
            } 
            else if (data.action === 'SELECT_TOPIC') {
                setScreen('screen-topics'); // Giữ nguyên màn hình chủ đề
                const cards = document.querySelectorAll('.topic-card');
                cards.forEach((card, index) => {
                    card.classList.remove('selected-top', 'selected-bottom', 'zoom-out');
                    if (card.dataset.topic === data.topicName) {
                        if (index === 0) {
                            card.classList.add('selected-top');
                        } else {
                            card.classList.add('selected-bottom');
                        }
                    } else {
                        card.classList.add('zoom-out');
                    }
                });
            }
            else if (data.action === 'PRELOAD_QUESTION') {
                loadQuestionData(data.questionData);
            }
            else if (data.action === 'SWITCH_TO_QA_SCREEN') {
                setScreen('screen-qa');
                if (data.questionData) {
                    loadQuestionData(data.questionData);
                }
            }
            else if (data.action === 'UPDATE_LIFELINES') {
                ['25', '50', '75'].forEach(val => {
                    const el = document.getElementById(`ll-${val}`);
                    if (data.used[val]) {
                        el.classList.add('used');
                    } else {
                        el.classList.remove('used');
                    }
                });
            }
            else if (data.action === 'ANIMATE_QUESTION') {
                setScreen('screen-qa');
                const qBox = document.getElementById('question-box');
                qBox.classList.remove('wipe-up');
                void qBox.offsetWidth;
                qBox.classList.add('wipe-up');
            }
            else if (data.action === 'ANIMATE_OPTION') {
                setScreen('screen-qa');
                const opt = document.getElementById(`opt-${data.key}`);
                if (opt) {
                    opt.classList.remove('wipe-down');
                    void opt.offsetWidth;
                    opt.classList.add('wipe-down');
                }
            }
            else if (data.action === 'SELECT_PLAYER_ANSWER') {
                selectedPlayerKey = data.key;
                ['A', 'B', 'C'].forEach(key => {
                    document.getElementById(`opt-${key}`).classList.remove('player-selected', 'wrong', 'correct');
                });
                const opt = document.getElementById(`opt-${data.key}`);
                if (opt) opt.classList.add('player-selected');
            }
            else if (data.action === 'SHOW_CORRECT_ANSWER') {
                const correctOpt = document.getElementById(`opt-${data.correctKey}`);
                if (correctOpt) {
                    correctOpt.classList.remove('player-selected');
                    correctOpt.classList.add('correct');
                }

                if (selectedPlayerKey && selectedPlayerKey !== data.correctKey) {
                    const wrongOpt = document.getElementById(`opt-${selectedPlayerKey}`);
                    if (wrongOpt) {
                        wrongOpt.classList.remove('player-selected');
                        wrongOpt.classList.add('wrong');
                    }
                }
            }
            else if (data.action === 'PREPARE_ELIMINATION') {
                setScreen('screen-elimination');
                pendingEliminatedCount = data.count;
                const card = document.getElementById('number-card');
                card.className = 'number-card purple';
                document.getElementById('eliminated-count-text').innerText = '0';
            }
            else if (data.action === 'REVEAL_ELIMINATION') {
                setScreen('screen-elimination');
                const card = document.getElementById('number-card');
                const countText = document.getElementById('eliminated-count-text');

                card.className = 'number-card red';
                let current = 0;
                const target = pendingEliminatedCount;

                if (target === 0) {
                    countText.innerText = '0';
                    return;
                }

                function step() {
                    if (current < target) {
                        current++;
                        countText.innerText = current;
                        const randomInterval = Math.floor(Math.random() * 450) + 80;
                        setTimeout(step, randomInterval);
                    }
                }
                step();
            }
        };
    </script>
</body>
</html>
